services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: loguser
      POSTGRES_PASSWORD: logpass
      POSTGRES_DB: logexplorer
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U loguser -d logexplorer"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
