name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  build:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: loguser
          POSTGRES_PASSWORD: logpass
          POSTGRES_DB: logexplorer
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgres://loguser:logpass@localhost:5432/logexplorer
      JWT_SECRET: ci-test-only-secret-not-a-real-credential
      JWT_EXPIRES_IN: 60m
      COOKIE_SECURE: "false"
      CORS_ORIGIN: http://localhost:5173
      AUTH_RATE_LIMIT_MAX: "10"
      AUTH_RATE_LIMIT_WINDOW_MS: "60000"
      INGEST_RATE_LIMIT_MAX: "1000"
      INGEST_RATE_LIMIT_WINDOW_MS: "60000"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Run migrations
        run: npm run migrate:up -w apps/api
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test
